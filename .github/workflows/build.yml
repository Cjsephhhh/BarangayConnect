name: BarangayConnect CI and Formatting

on:
  push:
    branches:
      - main
      - increment-1-auth
      - increment-2-profile-password
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality:
    name: Format and verify application
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Format Java source
        run: mvn -B -f backend/pom.xml spotless:apply

      - name: Format frontend and documentation
        run: >-
          npx --yes prettier@3.6.2 --write
          "frontend/src/**/*.{js,jsx,css,json}"
          "frontend/package.json"
          "README.md"
          ".github/workflows/*.yml"
          ".prettierrc.json"

      - name: Test and package backend
        run: mvn -B -f backend/pom.xml test package

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Commit formatted source to Increment 2
        if: github.event_name == 'push' && github.ref == 'refs/heads/increment-2-profile-password'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "All tracked files already follow the configured format."
          else
            git commit -m "style: apply consistent project formatting"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
